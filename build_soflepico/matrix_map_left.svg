<text x="28.0" y="490.0" font-size="19" fill="#1f2933" dominant-baseline="hanging">引脚对照（COL2ROW：列是带上拉的输入，行是输出）</text>
<text x="28.0" y="514.0" font-size="16" fill="#52606d" dominant-baseline="hanging">行：r0=GP9   r1=GP10   r2=GP11   r3=GP12   r4=GP13</text>
<text x="28.0" y="538.0" font-size="16" fill="#52606d" dominant-baseline="hanging">列：c0=GP1   c1=GP2   c2=GP3   c3=GP4   c4=GP5   c5=GP8</text>
<text x="28.0" y="582.0" font-size="16" fill="#8c1c1c" dominant-baseline="hanging">实测结论：列 0-3（GP1/GP2/GP3/GP4）在行 0-3 整片不出；列 4-5（GP5/GP8）正常。</text>
<text x="28.0" y="606.0" font-size="16" fill="#8c1c1c" dominant-baseline="hanging">但拇指行的 c3（GP4，LOWER）是好的 → 断点在「拇指行以上」的列线，或 Pico 引脚本身。</text>
<text x="28.0" y="650.0" font-size="16" fill="#1f2933" dominant-baseline="hanging">排查顺序：</text>
<text x="28.0" y="674.0" font-size="15" fill="#52606d" dominant-baseline="hanging">1. 烧 sofle_pico_pintest.uf2，把 Pico 拔下来单独插 USB 跑，看 col0-col3 的 up/down/low</text>
<text x="28.0" y="694.0" font-size="15" fill="#52606d" dominant-baseline="hanging">2. 烧 sofle_pico_debug.uf2，跳线短接引脚根部（不是焊盘）与 GP9，看 console 出不出 DOWN r0 cX</text>
<text x="28.0" y="714.0" font-size="15" fill="#52606d" dominant-baseline="hanging">3. 万用表：断电量 GP1↔GND / GP1↔3V3 是否短路；通电量各列脚空载电压是否都在 3.3V 附近</text>
